name: MT6765 Kernel Build (Stable Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            git curl zip unzip bc bison flex \
            build-essential ccache \
            libssl-dev libelf-dev \
            perl rsync \
            clang lld llvm \
            python3

      - name: Install Python2 manually (IMPORTANT FIX)
        run: |
          sudo apt install -y wget

          cd /tmp
          wget https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz

          tar -xvf Python-2.7.18.tgz
          cd Python-2.7.18

          ./configure --prefix=/usr/local/python2
          make -j$(nproc)
          sudo make install

          sudo ln -sf /usr/local/python2/bin/python2 /usr/bin/python2
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Clone toolchains
        run: |
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \
            gcc64

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 \
            gcc32

          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64

          export KBUILD_BUILD_USER=github-actions
          export KBUILD_BUILD_HOST=github

          export PATH="$(pwd)/gcc64/bin:$(pwd)/gcc32/bin:$PATH"

          # FORCE LLVM LINKER FIX
          export LD=ld.lld
          export LDFLAGS="-fuse-ld=lld"
          export KBUILD_LDFLAGS="-fuse-ld=lld"

          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          make O=out ARCH=arm64 2e_defconfig

          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi-

      - name: Package
        run: |
          DATE=$(date +"%Y%m%d-%H%M")

          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel/

          cd AnyKernel
          zip -r9 Kernel-${DATE}.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: AnyKernel/*.zip
