name: Kernel Build (Python2 Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ubuntu:20.04

    steps:
      - name: Install dependencies
        run: |
          apt update

          DEBIAN_FRONTEND=noninteractive apt install -y \
            git curl zip unzip bc bison flex \
            build-essential ccache \
            libssl-dev libelf-dev \
            python2 python-is-python2 \
            perl rsync clang lld llvm

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Clone toolchains
        run: |
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \
            gcc64

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 \
            gcc32

          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64

          export KBUILD_BUILD_USER=github-actions
          export KBUILD_BUILD_HOST=github

          export PATH="$(pwd)/gcc64/bin:$(pwd)/gcc32/bin:$PATH"

          make O=out ARCH=arm64 2e_defconfig

          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi-

      - name: Package
        run: |
          DATE=$(date +"%Y%m%d-%H%M")
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel/
          cd AnyKernel
          zip -r9 Kernel-${DATE}.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: AnyKernel/*.zip
